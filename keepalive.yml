name: keepalive
# Render 免费实例 15 分钟无请求会休眠，这里每 10 分钟摸一次。
# 放仓库就别删；用不到的月份在 Actions 里手动 disable 即可。
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ping
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 https://pen2ai.onrender.com/ping || echo 000)
            echo "try $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
